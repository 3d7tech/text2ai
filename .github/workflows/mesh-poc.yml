name: mesh-poc

on:
  push:
    branches: [main, mesh-poc]
    paths: ["mesh-poc/**", ".github/workflows/mesh-poc.yml"]
  pull_request:
    paths: ["mesh-poc/**", ".github/workflows/mesh-poc.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesh-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mesh-poc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Mesh core unit tests
        run: ./gradlew :core:test --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Build standalone hub (any computer with Java)
        run: ./gradlew :desktop:hubJar --console=plain

      - name: Android lint (report only)
        run: ./gradlew :app:lintDebug --console=plain

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            mesh-poc/core/build/reports/tests/
            mesh-poc/app/build/reports/lint-results-debug.html

      - name: Assemble download page
        run: |
          mkdir -p _site
          cp app/build/outputs/apk/debug/app-debug.apk _site/offgrid-mesh.apk
          cp desktop/build/hub/offgrid-hub.jar _site/offgrid-hub.jar
          sed -e "s/__COMMIT__/${GITHUB_SHA::7}/g" -e "s/__DATE__/$(date -u +%Y-%m-%d)/g" site/index.html > _site/index.html

      - name: Upload site files
        uses: actions/upload-artifact@v4
        with:
          name: site-base
          path: mesh-poc/_site

  mac-app:
    # Family Chat Hub.app in a .dmg, Java bundled: double-click, no Terminal.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: apple
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    defaults:
      run:
        working-directory: mesh-poc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build hub jar
        run: ./gradlew -p desktop hubJar --console=plain

      - name: Make app icon
        run: |
          mkdir -p build-mac/FamilyChat.iconset
          src=core/src/main/resources/hub/icon-512.png
          for s in 16 32 128 256 512; do
            sips -z $s $s "$src" --out build-mac/FamilyChat.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); [ $d -le 512 ] && sips -z $d $d "$src" --out build-mac/FamilyChat.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns build-mac/FamilyChat.iconset -o build-mac/FamilyChat.icns

      - name: Package app
        run: |
          jpackage --type app-image --dest build-mac/image \
            --name "Family Chat Hub" --app-version 1.0.0 --vendor "Offgrid Mesh" \
            --input desktop/build/hub --main-jar offgrid-hub.jar --main-class com.offgrid.hubapp.HubAppKt \
            --icon build-mac/FamilyChat.icns --mac-package-identifier com.offgrid.familychathub \
            --add-modules java.base,java.desktop
          # Ad-hoc signature so macOS offers "Open Anyway" (no paid Apple Developer ID yet)
          codesign --force --deep --sign - "build-mac/image/Family Chat Hub.app"
          jpackage --type dmg --dest build-mac/dmg --name "Family Chat Hub" --app-version 1.0.0 \
            --app-image "build-mac/image/Family Chat Hub.app"
          mv build-mac/dmg/*.dmg "build-mac/FamilyChatHub-mac-${{ matrix.arch }}.dmg"
          ls -la build-mac

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: mesh-poc/build-mac/FamilyChatHub-mac-${{ matrix.arch }}.dmg

  site:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [build, mac-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-base
          path: _site
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: mac-*
          path: _site
          merge-multiple: true
      - run: ls -la _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
