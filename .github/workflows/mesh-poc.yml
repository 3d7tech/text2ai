name: mesh-poc

on:
  push:
    branches: [main, mesh-poc]
    paths: ["mesh-poc/**", ".github/workflows/mesh-poc.yml"]
  pull_request:
    paths: ["mesh-poc/**", ".github/workflows/mesh-poc.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesh-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mesh-poc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Mesh core unit tests
        run: ./gradlew :core:test --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Android lint (report only)
        run: ./gradlew :app:lintDebug --console=plain

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            mesh-poc/core/build/reports/tests/
            mesh-poc/app/build/reports/lint-results-debug.html

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offgrid-mesh-apk
          path: mesh-poc/app/build/outputs/apk/debug/app-debug.apk

      - name: Assemble download page
        run: |
          mkdir -p _site
          cp app/build/outputs/apk/debug/app-debug.apk _site/offgrid-mesh.apk
          sed -e "s/__COMMIT__/${GITHUB_SHA::7}/g" -e "s/__DATE__/$(date -u +%Y-%m-%d)/g" site/index.html > _site/index.html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: mesh-poc/_site

  deploy-pages:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
